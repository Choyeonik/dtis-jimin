    const statusMeta = {
      pending: { label: '대기 전', bg: '#e7e7ea', color: '#5d5d60', icon: true, iconHtml: { __html: clockIcon }, iconAnim: 'none' },
      running: { label: '진행 중', bg: '#eef6ff', color: '#2c455d', icon: true, iconHtml: { __html: loaderIcon }, iconAnim: 'dc-spin 1s linear infinite' },
      done: { label: '완료됨', bg: '#5980a6', color: '#f2f2f3', icon: true, iconHtml: { __html: checkIcon }, iconAnim: 'none' },
    };

    const runBadge = runStatus === 'running'
      ? { label: '실행 중', bg: '#eef6ff', color: '#2c455d', dot: '#5980a6', dotAnim: 'dc-pulse 1.4s ease-in-out infinite' }
      : { label: '대기 중', bg: '#e7e7ea', color: '#5d5d60', dot: '#98989b', dotAnim: 'none' };

    const logEntries = [];
    if (slot1Status === 'running') logEntries.push({ time: '13:02:11', text: '슬롯 1 · 좌석 새로고침 중' });
    if (slot1Status === 'done') logEntries.push({ time: '13:02:47', text: '슬롯 1 · 신청 완료' });
    if (slot2Status === 'running') logEntries.push({ time: '13:04:03', text: '슬롯 2 · 좌석 새로고침 중' });
    if (slot2Status === 'done') logEntries.push({ time: '13:05:58', text: '슬롯 2 · 신청 완료' });
    logEntries.reverse();

    return {
      runBadge,
      slot1Badge: statusMeta[slot1Status],
      slot2Badge: statusMeta[slot2Status],
      logEntries,
      hasLogs: logEntries.length > 0,
      stationsFrom: ['서울', '청량리', '용산'],
      stationsTo: ['동두천', '의정부', '춘천'],
      startDisabled: runStatus === 'running',
      stopDisabled: runStatus === 'idle',
      startOpacity: runStatus === 'running' ? 0.45 : 1,
      stopOpacity: runStatus === 'idle' ? 0.45 : 1,
    };
  }
}

</script>

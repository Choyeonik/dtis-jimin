<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>잔여석 신청</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>

<header class="header">
  <div class="header-title">
    <img class="header-icon" src="assets/header-icon.png" alt="" />
    <div>
      <div class="header-name">잔여석 신청</div>
    </div>
    <button type="button" class="open-site-btn" id="open-site-btn">DTIS 열기</button>
    <label class="enable-toggle shutdown-toggle" title="모든 신청이 완료되면 5분 뒤 PC를 자동으로 종료합니다">
      <span class="shutdown-label">자동 종료</span>
      <input type="checkbox" id="shutdown-toggle-input" />
      <span class="enable-btn"><span class="enable-text" id="shutdown-toggle-label">OFF</span></span>
    </label>
  </div>
  <div id="run-badge" class="badge">
    <span class="dot"></span>
    <span id="run-label">대기 중</span>
  </div>
</header>

<div class="shutdown-banner" id="shutdown-banner" hidden>
  <span>PC 종료까지 <strong class="shutdown-countdown" id="shutdown-countdown">05:00</strong></span>
  <button type="button" class="open-site-btn" id="shutdown-cancel-btn">종료 취소</button>
</div>

<main class="content">

  <section class="slot" id="slot-0" data-index="0">
    <div class="slot-header">
      <div class="slot-title-row">
        <span class="slot-title">첫 번째 신청</span>
        <label class="enable-toggle">
          <input type="checkbox" data-field="enabled" />
          <span class="enable-btn"><span class="enable-text" data-field="enabled-label">ON</span></span>
        </label>
      </div>
      <span class="status-badge" data-status-for="0">대기 전</span>
    </div>
    <div class="field">
      <span class="field-label">탑승일자</span>
      <div class="date-row">
        <input type="date" class="date-input" data-field="date" />
        <button type="button" class="query-btn" data-field="query-btn"><span class="query-label query-label-default">조회</span><span class="query-label query-label-check">✓</span></button>
      </div>
    </div>
    <div class="hint" data-field="stations-hint">날짜를 선택하면 자동으로 역 목록을 불러옵니다</div>
    <div class="field-row">
      <label class="field">
        <span class="field-label">출발역</span>
        <select class="select-input" data-field="from"></select>
      </label>
      <label class="field">
        <span class="field-label">도착역</span>
        <select class="select-input" data-field="to"></select>
      </label>
    </div>
    <div class="field-row">
      <div class="field">
        <span class="field-label">허용 출발역 (선택)</span>
        <div class="alt-station-stack">
          <input type="text" class="select-input" data-field="altFrom" placeholder="예: 서울" />
          <input type="text" class="select-input" data-field="altFrom" placeholder="예: 광명" />
        </div>
      </div>
      <div class="field">
        <span class="field-label">최소 하차역 (선택)</span>
        <div class="alt-station-stack">
          <input type="text" class="select-input" data-field="altTo" placeholder="예: 동대구" />
          <input type="text" class="select-input" data-field="altTo" placeholder="예: 오송" />
        </div>
      </div>
    </div>
    <div class="field">
      <span class="field-label">출발 시간</span>
      <div class="ampm-toggle">
        <label class="ampm-option"><input type="radio" name="ampm-0" value="AM" /><span class="ampm-label">오전</span></label>
        <label class="ampm-option"><input type="radio" name="ampm-0" value="PM" /><span class="ampm-label">오후</span></label>
        <label class="ampm-option"><input type="radio" name="ampm-0" value="ALL" /><span class="ampm-label">둘 다</span></label>
      </div>
    </div>
  </section>

  <section class="slot" id="slot-1" data-index="1">
    <div class="slot-header">
      <div class="slot-title-row">
        <span class="slot-title">두 번째 신청</span>
        <label class="enable-toggle">
          <input type="checkbox" data-field="enabled" />
          <span class="enable-btn"><span class="enable-text" data-field="enabled-label">ON</span></span>
        </label>
      </div>
      <span class="status-badge" data-status-for="1">대기 전</span>
    </div>
    <div class="field">
      <span class="field-label">탑승일자</span>
      <div class="date-row">
        <input type="date" class="date-input" data-field="date" />
        <button type="button" class="query-btn" data-field="query-btn"><span class="query-label query-label-default">조회</span><span class="query-label query-label-check">✓</span></button>
      </div>
    </div>
    <div class="hint" data-field="stations-hint">날짜를 선택하면 자동으로 역 목록을 불러옵니다</div>
    <div class="field-row">
      <label class="field">
        <span class="field-label">출발역</span>
        <select class="select-input" data-field="from"></select>
      </label>
      <label class="field">
        <span class="field-label">도착역</span>
        <select class="select-input" data-field="to"></select>
      </label>
    </div>
    <div class="field-row">
      <div class="field">
        <span class="field-label">허용 출발역 (선택)</span>
        <div class="alt-station-stack">
          <input type="text" class="select-input" data-field="altFrom" placeholder="예: 서울" />
          <input type="text" class="select-input" data-field="altFrom" placeholder="예: 광명" />
        </div>
      </div>
      <div class="field">
        <span class="field-label">최소 하차역 (선택)</span>
        <div class="alt-station-stack">
          <input type="text" class="select-input" data-field="altTo" placeholder="예: 동대구" />
          <input type="text" class="select-input" data-field="altTo" placeholder="예: 오송" />
        </div>
      </div>
    </div>
    <div class="field">
      <span class="field-label">출발 시간</span>
      <div class="ampm-toggle">
        <label class="ampm-option"><input type="radio" name="ampm-1" value="AM" /><span class="ampm-label">오전</span></label>
        <label class="ampm-option"><input type="radio" name="ampm-1" value="PM" /><span class="ampm-label">오후</span></label>
        <label class="ampm-option"><input type="radio" name="ampm-1" value="ALL" /><span class="ampm-label">둘 다</span></label>
      </div>
    </div>
  </section>

  <section class="log-panel">
    <div class="log-title">실행 로그</div>
    <div id="log-list" class="log-list">
      <div class="log-empty">아직 기록이 없습니다</div>
    </div>
  </section>

</main>

<footer class="footer">
  <label class="run-toggle">
    <input type="checkbox" id="run-toggle-input" />
    <span class="run-btn"><span class="run-text" id="run-toggle-label">시작</span></span>
  </label>
</footer>

<script src="sidepanel.js"></script>
</body>
</html>
